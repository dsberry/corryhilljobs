<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House Jobs</title>
<style>
:root{--bg:#f7f6f2;--sf:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#dedcd4;--ac:#2f6f5e;--ac2:#e3efe9;--hi:#b3402a;--md:#b9801c;--lo:#4a7a9b;

:root[data-theme="dark"]{--bg:#161715;--sf:#212320;--tx:#ecebe6;--mu:#9b9a92;--bd:#34362f;--ac:#6fc3aa;--ac2:#25352f;--hi:#e8826c;--md:#e0b14f;--lo:#7fb1d1}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:18px;margin:0 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:7px 11px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.d{color:var(--hi)}
.sum{margin-left:auto;color:var(--mu);font-size:14px}

.row{display:flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px;margin:5px 0}
.row.done .t{text-decoration:line-through;color:var(--mu)}
.tg{width:26px;height:26px;padding:0;flex:none;text-align:center}
.tg.none{visibility:hidden}
.t{flex:1;min-width:0;cursor:pointer}
.t b{font-weight:600;display:block;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--mu);display:flex;flex-wrap:wrap;gap:4px 10px}
.pri{font-weight:600}
.pri.High{color:var(--hi)}.pri.Medium{color:var(--md)}.pri.Low{color:var(--lo)}
.kids{margin-left:16px;border-left:2px solid var(--bd);padding-left:6px}
input[type=checkbox]{width:20px;height:20px;flex:none}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--sf);color:var(--tx);width:min(560px,94vw);max-height:92vh;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
textarea{min-height:110px;resize:vertical}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
#qs{width:100%;margin-top:8px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px}
mark{background:var(--md);color:#000;border-radius:3px;padding:0 1px}
.snip{font-size:13px;color:var(--mu);overflow-wrap:anywhere;margin-top:2px}
#tip{position:fixed;z-index:20;display:none;max-width:min(380px,80vw);background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:14px;overflow-wrap:anywhere;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none}
.at{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd);font-size:14px;overflow-wrap:anywhere}
.lk{padding:1px 8px;font-size:12px;margin-left:8px}
.prev{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;min-height:110px;overflow-wrap:anywhere;font-size:15px}
.prev p,#tip p{margin:0 0 5px}.prev ul,#tip ul{margin:2px 0 5px;padding-left:20px}
.prev a,#tip a{color:var(--ac);text-decoration:underline}
.prev code,#tip code{background:var(--ac2);padding:0 3px;border-radius:3px}
.mh{font-weight:700;margin:4px 0 3px}
#kl a{color:var(--ac);text-decoration:underline;cursor:pointer}
#kl a.dn{text-decoration:line-through}
#pl{color:var(--ac);text-decoration:underline;cursor:pointer;font-size:14px}
#dl a{color:var(--ac);text-decoration:underline;cursor:pointer}
.blk{color:var(--hi);font-weight:600}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
</style>
</head>
<body>
<header>
<h1>House jobs</h1>
<div class="bar">
<button class="p" id="add">+ Job</button>
<button id="exp">Expand all</button>
<button id="col">Collapse all</button>
<button id="sv">Save file</button>
<button id="ld">Load file</button>
<input type="file" id="fi" accept=".txt,.json,text/plain,application/json" hidden>
<span class="sum"><span id="st"></span> · <span id="sum"></span></span>
</div>
<input type="search" id="qs" placeholder="Search all jobs…" autocomplete="off">
</header>
<main id="list"></main>
<div id="tip"></div>

<dialog id="ed">
<div id="psec" hidden><a href="#" id="pl"></a></div>
<label>Title</label><input type="text" id="f-title">
<label>Parent job (change to move this job)</label><select id="f-par"></select>
<div id="ksec" hidden><label>Sub-jobs</label><div id="kl"></div></div>
<label>Description <button type="button" id="mdt" class="lk">Preview</button></label><textarea id="f-desc" placeholder="Supports **bold**, *italic*, - bullet lists, # headings, [text](https://link) and plain web addresses"></textarea><div id="f-prev" class="prev" hidden></div>
<div class="g">
<div><label>Priority</label><select id="f-pri"><option>High</option><option selected>Medium</option><option>Low</option></select><div id="prih" class="meta" hidden>Set automatically: the highest priority of its child jobs.</div></div>
<div><label>Cost (£)</label><input type="number" id="f-cost" min="0" step="any" inputmode="decimal"></div>
<div><label>Start date</label><input type="date" id="f-start"></div>
<div><label>Duration (days)</label><input type="number" id="f-dur" min="0" step="any" inputmode="decimal"></div>
</div>
<label><input type="checkbox" id="f-done"> Done</label>
<label>Blocked by (these must be done first)</label><div id="dl"></div><select id="dsel"></select>
<label>Attachments</label><div id="atl"></div>
<button type="button" id="aadd">+ Add file</button><input type="file" id="fa" multiple hidden>
<div class="acts">
<button class="p" id="ok">Save</button>
<button id="kid">+ Child job</button>
<button id="up">Move up</button>
<button id="dn">Move down</button>
<button class="d" id="del">Delete</button>
<button id="cx">Close</button>
</div>
</dialog>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

function render(){

(function w(a,dp){a.forEach(function(j){if(j.id!==cur.id&&(cur.dep||[]).indexOf(j.id)<0&&!reaches(j,cur.id))o+='<option value="'+j.id+'">'+"\u00a0\u00a0".repeat(dp)+esc(j.title||"(untitled)")+'</option>';w(j.kids,dp+1)})})(jobs,0);

(function(){
var tip=document.getElementById("tip"),L=document.getElementById("list");
function place(e){var w=tip.offsetWidth,h=tip.offsetHeight,x=e.clientX+14,y=e.clientY+16;if(x+w>innerWidth-8)x=Math.max(8,innerWidth-w-8);if(y+h>innerHeight-8)y=Math.max(8,e.clientY-h-12);tip.style.left=x+"px";tip.style.top=y+"px"}
L.addEventListener("mouseover",function(e){var b=e.target.closest(".t b");if(!b)return;var r=find(b.closest("[data-e]").dataset.e);if(!r||!r.j.desc||!r.j.desc.trim())return;var d=r.j.desc;tip.innerHTML=md(d.length>600?d.slice(0,600)+"…":d);tip.style.display="block";place(e)});
L.addEventListener("mousemove",function(e){if(tip.style.display==="block")place(e)});
L.addEventListener("mouseout",function(e){if(e.target.closest(".t b"))tip.style.display="none"});
})();
var CH=700000,MAXB=5*1024*1024;
function filesCol(){return dref?firebase.firestore().collection("files"):null}
function fsz(n){return n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB"}
function renderAtt(){var h="";(cur.att||[]).forEach(function(a){h+='<div class="at"><span>'+esc(a.name)+' <i>('+fsz(a.size)+')</i></span><span><button type="button" data-ao="'+a.id+'">Open</button> <button type="button" class="d" data-ar="'+a.id+'">Remove</button></span></div>'});document.getElementById("atl").innerHTML=h||'<div class="meta">No attachments</div>'}
function readB64(blob){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(String(r.result).split(",")[1]||"")};r.onerror=no;r.readAsDataURL(blob)})}
function shrink(file){return new Promise(function(ok){
if(!/^image\/(jpeg|png|webp)/.test(file.type)){ok(file);return}
var im=new Image(),u=URL.createObjectURL(file);
im.onload=function(){var s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){ok(b&&b.size<file.size?new File([b],file.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"}):file)},"image/jpeg",.82)};
im.onerror=function(){URL.revokeObjectURL(u);ok(file)};im.src=u})}
function addFiles(list){
var col=filesCol();if(!col){alert("Attachments need sync (Firebase) to be set up first.");return}
Array.prototype.forEach.call(list,function(f0){shrink(f0).then(function(f1){
if(f1.size>MAXB){alert(f0.name+" is over 5 MB.");return}
return readB64(f1).then(function(b64){
var id=uid()+uid(),n=Math.max(1,Math.ceil(b64.length/CH)),b=firebase.firestore().batch();
for(var i=0;i<n;i++)b.set(col.doc(id+"_"+i),{d:b64.slice(i*CH,(i+1)*CH)});
return b.commit().then(function(){cur.att=cur.att||[];cur.att.push({id:id,name:f1.name,type:f1.type,size:f1.size,n:n});save();renderAtt();render()})})
}).catch(function(){alert("Couldn\u2019t attach "+f0.name)})})}
function openAtt(id){var a=(cur.att||[]).filter(function(x){return x.id===id})[0],col=filesCol();if(!a||!col)return;
var ps=[];for(var i=0;i<a.n;i++)ps.push(col.doc(id+"_"+i).get());
Promise.all(ps).then(function(ds){var bin=atob(ds.map(function(d){return d.data().d}).join("")),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
var url=URL.createObjectURL(new Blob([u],{type:a.type||"application/octet-stream"})),l=document.createElement("a");l.href=url;l.download=a.name;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(url)},4000)}).catch(function(){alert("Couldn\u2019t open that attachment.")})}
function delChunks(a){var col=filesCol();if(!col)return;var b=firebase.firestore().batch();for(var i=0;i<a.n;i++)b.delete(col.doc(a.id+"_"+i));b.commit().catch(function(){})}
function removeAtt(id){var k=(cur.att||[]).findIndex(function(x){return x.id===id});if(k<0||!confirm("Remove this attachment?"))return;delChunks(cur.att[k]);cur.att.splice(k,1);save();renderAtt();render()}
document.getElementById("atl").onclick=function(e){var o=e.target.closest("[data-ao]"),r=e.target.closest("[data-ar]");if(o)openAtt(o.dataset.ao);else if(r)removeAtt(r.dataset.ar)};
document.getElementById("aadd").onclick=function(){document.getElementById("fa").click()};
document.getElementById("fa").onchange=function(e){var l=e.target.files;if(l&&l.length)addFiles(l);e.target.value=""};
document.getElementById("mdt").onclick=function(){var d=f("desc"),p=document.getElementById("f-prev");if(d.hidden){showEdit()}else{p.innerHTML=md(d.value)||'<span class="meta">Nothing to preview</span>';d.hidden=true;p.hidden=false;this.textContent="Edit"}};
document.getElementById("pl").onclick=function(e){e.preventDefault();var id=this.dataset.k;commit();openEd(id)};
document.getElementById("kl").onclick=function(e){var a=e.target.closest("[data-k]");if(!a)return;e.preventDefault();var id=a.dataset.k;commit();openEd(id)};
document.getElementById("dsel").onchange=function(){var v=this.value;if(!v)return;cur.dep=cur.dep||[];cur.dep.push(v);save();renderDeps();render()};
document.getElementById("dl").onclick=function(e){var r=e.target.closest("[data-dr]"),k=e.target.closest("[data-dk]");if(r){cur.dep=(cur.dep||[]).filter(function(x){return x!==r.dataset.dr});save();renderDeps();render()}else if(k){e.preventDefault();var id=k.dataset.dk;commit();openEd(id)}};
document.getElementById("qs").oninput=function(e){q=e.target.value.trim().toLowerCase();render()};
load();render();initSync();
</script>
